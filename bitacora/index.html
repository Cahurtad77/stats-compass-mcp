<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora</title>
  <meta name="description" content="App personal liviana: finanzas, contabilidad y vida profesional, local-first.">

  <link rel="icon" href="icon.svg" type="image/svg+xml">

</head>

  <a class="saltar" href="#contenido">Saltar al contenido</a>

      <button class="btn-sec tema" data-tema type="button">Tema claro / oscuro</button>
    </aside>
    <div class="principal">
      <div class="barra-movil"><button id="btn-menu" class="icono" aria-label="Menú">☰</button><strong>Bitácora</strong>

      <main id="contenido" tabindex="-1"><p class="sutil">Cargando…</p></main>

</html>
